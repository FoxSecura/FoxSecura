[package]
name = "foxsecura"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "FoxSecura - bot Discord de sécurité réécrit en Rust."
license = "AGPL-3.0-only"
repository = "https://github.com/FoxSecura/FoxSecura"
publish = false

[dependencies]
poise = "=0.7.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.145"
serenity = { version = "=0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
