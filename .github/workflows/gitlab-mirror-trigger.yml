name: GitLab Mirror Trigger

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  trigger:
    name: Signal GitLab mirror
    runs-on: ubuntu-latest

    steps:
      - name: Signal mirror synchronization
        shell: bash
        run: echo "GitHub push registered for GitLab mirroring."
