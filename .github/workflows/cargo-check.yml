name: Cargo Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check and test
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Cargo check
        run: cargo +1.98.1 check --all-targets

      - name: Cargo test
        run: cargo +1.98.1 test --all-targets
