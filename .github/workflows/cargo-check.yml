name: Cargo Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check and test
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Format modified Rust files
        run: |
          rustup component add rustfmt --toolchain 1.98.1
          rustfmt +1.98.1 --edition 2024 --config skip_children=true src/lib.rs src/app/mod.rs src/app/data.rs src/app/events.rs src/app/intents.rs src/database/mod.rs src/database/migrations.rs src/database/slowmodes.rs src/protection/anti_spam/anti_ghost_ping/detector.rs tests/runtime.rs src/runtime/members.rs src/runtime/mod.rs src/runtime/audit.rs src/runtime/config.rs src/runtime/messages.rs src/runtime/actions.rs src/runtime/ai.rs src/runtime/automod.rs src/runtime/engine.rs
          git diff --no-color -- src/lib.rs src/app/mod.rs src/app/data.rs src/app/events.rs src/app/intents.rs src/database/mod.rs src/database/migrations.rs src/database/slowmodes.rs src/protection/anti_spam/anti_ghost_ping/detector.rs tests/runtime.rs src/runtime/members.rs src/runtime/mod.rs src/runtime/audit.rs src/runtime/config.rs src/runtime/messages.rs src/runtime/actions.rs src/runtime/ai.rs src/runtime/automod.rs src/runtime/engine.rs

      - name: Cargo check
        run: cargo +1.98.1 check --all-targets

      - name: Cargo test
        run: cargo +1.98.1 test --all-targets
